name: learning-agent
version: 3.0.0
description: Pattern learning and confidence management specialist

domain: MachineLearning
technology: ALL

# LLM Provider Configuration
llm:
  provider: ruvllm
  model: ruvltra-medium-1.1b-q4_k_m
  routing_model: ruvltra-claude-code-0.5b-q4_k_m
  embedding_model: ruvltra-small-0.5b-q4_k_m
  api_url: http://localhost:9090
  fallback_provider: ollama
  fallback_model: glm-4.7-flash:q8_0
  fallback_url: http://localhost:11434

capabilities:
  - Pattern discovery
  - Confidence scoring
  - Pattern optimization
  - Historical analysis
  - Trend detection
  - Anomaly detection
  - Model training coordination

patterns:
  - /pattern/i
  - /learn/i
  - /confidence/i
  - /train/i
  - /anomaly/i
  - /trend/i

autonomy_threshold: 70

broadcast_groups:
  - RanSpecialists
  - LearningGroup
  - Analytics

memory_namespace: learning-patterns

kpi_focus:
  - patternConfidence
  - successRate
  - predictionAccuracy
  - learningVelocity
  - patternCoverage

expertise_level: expert

fallback_agents:
  - alarm-agent
  - rrm-agent
