plan-build-review:
  description: "Plan, implement, and review — the standard development cycle"
  steps:
    - agent: planner
      prompt: "Plan the implementation for: $INPUT"
    - agent: builder
      prompt: "Implement the following plan:\n\n$INPUT"
    - agent: reviewer
      prompt: "Review this implementation for bugs, style, and correctness:\n\n$INPUT"

plan-build:
  description: "Plan then build — fast two-step implementation without review"
  steps:
    - agent: planner
      prompt: "Plan the implementation for: $INPUT"
    - agent: builder
      prompt: "Based on this plan, implement:\n\n$INPUT"

scout-flow:
  description: "Triple-scout deep recon — explore, validate, verify"
  steps:
    - agent: scout
      prompt: "Explore the codebase and investigate: $INPUT\n\nReport your findings with structure, key files, and patterns."
    - agent: scout
      prompt: "Validate and cross-check the following analysis. Look for anything missed, incorrect, or incomplete:\n\n$INPUT\n\nOriginal request: $ORIGINAL"
    - agent: scout
      prompt: "Final review pass. Verify the analysis below is accurate and complete. Add any missing details or corrections:\n\n$INPUT\n\nOriginal request: $ORIGINAL"

plan-review-plan:
  description: "Iterative planning — plan, critique, then refine with feedback"
  steps:
    - agent: planner
      prompt: "Create a detailed implementation plan for: $INPUT"
    - agent: plan-reviewer
      prompt: "Critically review this implementation plan. Challenge assumptions, find gaps, and suggest improvements:\n\n$INPUT\n\nOriginal request: $ORIGINAL"
    - agent: planner
      prompt: "Revise and improve your implementation plan based on this critique. Address every issue raised and incorporate the recommendations:\n\nOriginal request: $ORIGINAL\n\nCritique:\n$INPUT"

full-review:
  description: "End-to-end pipeline — scout, plan, build, and review"
  steps:
    - agent: scout
      prompt: "Explore the codebase and identify: $INPUT"
    - agent: planner
      prompt: "Based on this analysis, create a plan:\n\n$INPUT"
    - agent: builder
      prompt: "Implement this plan:\n\n$INPUT"
    - agent: reviewer
      prompt: "Review this implementation:\n\n$INPUT"

provider-research:
  description: "RAG-enhanced research using ruvector + researcher + planner"
  steps:
    - agent: ruvector
      prompt: "Index relevant files for: $INPUT"
    - agent: researcher
      prompt: "Research: $INPUT using indexed knowledge"
    - agent: planner
      prompt: "Create implementation plan for: $ORIGINAL"

expert-build:
  description: "Domain-expert implementation with review"
  steps:
    - agent: planner
      prompt: "Architect solution for: $INPUT"
    - agent: coder
      prompt: "Implement: $INPUT (plan: $INPUT)"
    - agent: reviewer
      prompt: "Review implementation for: $ORIGINAL"

learn-improve:
  description: "Pattern-aware coding using past episodes"
  steps:
    - agent: scout
      prompt: "Explore codebase for context: $INPUT"
    - agent: ruvector
      prompt: "Search similar patterns: $INPUT"
    - agent: coder
      prompt: "Code using patterns: $INPUT"

full-swarm:
  description: "Coordinator dispatches parallel domain experts"
  steps:
    - agent: coordinator
      prompt: "Break down and dispatch to domain experts: $INPUT"

mega-swarm:
  description: "All available experts on a complex task"
  steps:
    - agent: coordinator
      prompt: "Orchestrate all relevant domain experts for: $INPUT"
    - agent: reviewer
      prompt: "Aggregate and validate results for: $ORIGINAL"
    - agent: documenter
      prompt: "Document final solution for: $ORIGINAL"

# Claude-Flow swarm chains (orchestrated via cf_swarm_start tool)
cf-dev-cycle:
  description: "Claude-Flow development swarm — plan, code, review, test with distributed coordination"
  steps:
    - agent: planner
      prompt: "Architect the solution for: $INPUT\nThis will be executed by a claude-flow development swarm."
    - agent: coder
      prompt: "Implement based on this architecture:\n\n$INPUT"
    - agent: reviewer
      prompt: "Review this implementation for correctness, security, and style:\n\n$INPUT"
    - agent: tester
      prompt: "Create comprehensive tests for:\n\n$INPUT\n\nOriginal objective: $ORIGINAL"

cf-research-synthesis:
  description: "Claude-Flow research swarm — gather, analyze, synthesize findings"
  steps:
    - agent: scout
      prompt: "Explore and gather information about: $INPUT"
    - agent: researcher
      prompt: "Analyze and cross-reference these findings:\n\n$INPUT\n\nOriginal query: $ORIGINAL"
    - agent: planner
      prompt: "Synthesize a structured report from this research:\n\n$INPUT\n\nOriginal query: $ORIGINAL"

cf-security-audit:
  description: "Claude-Flow testing swarm — security audit with red-team review"
  steps:
    - agent: scout
      prompt: "Map the attack surface and identify security-relevant code: $INPUT"
    - agent: red-team
      prompt: "Perform adversarial security analysis on:\n\n$INPUT\n\nOriginal scope: $ORIGINAL"
    - agent: tester
      prompt: "Create security test cases based on this analysis:\n\n$INPUT\n\nOriginal scope: $ORIGINAL"
    - agent: reviewer
      prompt: "Final security review — validate findings and prioritize remediation:\n\n$INPUT"

cf-optimize:
  description: "Claude-Flow optimization swarm — profile, refactor, validate"
  steps:
    - agent: scout
      prompt: "Profile and identify performance bottlenecks in: $INPUT"
    - agent: coder
      prompt: "Optimize the bottlenecks identified:\n\n$INPUT\n\nOriginal target: $ORIGINAL"
    - agent: tester
      prompt: "Benchmark before/after and validate no regressions:\n\n$INPUT\n\nOriginal target: $ORIGINAL"
    - agent: reviewer
      prompt: "Review optimization for correctness and measurable improvement:\n\n$INPUT"

telecom-analysis:
  description: "Telecom RAN analysis chain"
  steps:
    - agent: rrm
      prompt: "RRM analysis for: $INPUT"
    - agent: throughput
      prompt: "Throughput optimization for: $ORIGINAL (context: $INPUT)"
    - agent: learning
      prompt: "Extract learnings from analysis: $ORIGINAL"

swarm-demo:
  description: "10-agent federated learning demo with RVF consensus convergence"
  steps:
    - agent: planner
      prompt: "Create architecture spec for: $INPUT"
    - agent: researcher
      prompt: "Research best patterns for: $ORIGINAL (spec: $INPUT)"
    - agent: coder
      prompt: "Implement based on spec and research: $ORIGINAL (context: $INPUT)"
    - agent: reviewer
      prompt: "Review implementation for: $ORIGINAL (code: $INPUT)"
    - agent: tester
      prompt: "Create tests for: $ORIGINAL (implementation: $INPUT)"
